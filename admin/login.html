<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | E-Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="auth-page-body">
    <div class="auth-shell">
      <div class="auth-panel auth-illustration">
        <div class="auth-badge">Admin access</div>
        <h1>Library administration portal.</h1>
        <p>Secure access for managing books, users, borrowing records and library activity.</p>
        <div class="mini-quote">
          <strong>Restricted to staff</strong>
          <span>Use your admin account to continue.</span>
        </div>
      </div>

      <div class="auth-panel auth-form-panel">
        <div class="auth-header">
          <a href="/index.html" class="brand auth-brand">
            <span class="brand-mark">E</span>
            <span>E-Library</span>
          </a>
          <h2>Admin Login</h2>
        </div>

        <form id="admin-login-form" class="auth-form" novalidate>
          <div class="field-group">
            <label for="admin-email">Admin email</label>
            <input id="admin-email" name="email" type="email" placeholder="admin@elibrary.edu" required />
          </div>

          <div class="field-group password-wrap">
            <label for="admin-password">Password</label>
            <input id="admin-password" name="password" type="password" placeholder="Enter password" required />
            <button type="button" class="toggle-password" aria-label="Show password">Show</button>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Login as admin</button>
        </form>

        <p class="auth-footer">
          Need an admin account?
          <a href="/admin/register.html" class="text-link">Create account</a>
          <br />
          Student login?
          <a href="/login.html" class="text-link">Go to student portal</a>
        </p>
      </div>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
