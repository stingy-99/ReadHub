<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borrowings | E-Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="app-body">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand">
            <span class="brand-mark">E</span>
            <span>E-Library</span>
          </div>
        </div>

        <nav class="side-nav">
          <a href="dashboard.html">Admin Dashboard</a>
          <a href="books.html">Book Management</a>
          <a href="users.html">Users</a>
          <a href="borrowings.html" class="active">Borrowings</a>
          <a href="logbook.html">Library Visits</a>
        </nav>

        <div class="sidebar-footer">
          <button type="button" class="btn btn-secondary btn-block" data-logout>Logout</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Borrowing records</p>
            <h1>Borrowing status</h1>
          </div>
          <div class="topbar-right">
            <div class="user-pill" id="user-pill"></div>
          </div>
        </header>

        <section class="panel-card table-card">
          <div class="panel-head">
            <h2>All borrowing records</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Book</th>
                  <th>Borrowed</th>
                  <th>Due Date</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="admin-borrowings-table"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
