<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | E-Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="app-body">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand">
            <span class="brand-mark">E</span>
            <span>E-Library</span>
          </div>
        </div>

        <nav class="side-nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="books.html">Browse Books</a>
          <a href="my-books.html">My Books</a>
          <a href="logbook.html">Library Logbook</a>
          <a href="profile.html" class="active">Profile</a>
        </nav>

        <div class="sidebar-footer">
          <button type="button" class="btn btn-secondary btn-block" data-logout>Logout</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Account</p>
            <h1>My Profile</h1>
          </div>
          <div class="topbar-right">
            <div class="user-pill" id="user-pill"></div>
          </div>
        </header>

        <section class="panel-card profile-card">
          <form id="profile-form" class="auth-form">
            <div class="field-grid">
              <div class="field-group">
                <label for="profile-name">Full name</label>
                <input id="profile-name" name="fullName" type="text" required />
              </div>
              <div class="field-group">
                <label for="profile-student">Student ID</label>
                <input id="profile-student" name="studentId" type="text" required />
              </div>
            </div>

            <div class="field-grid">
              <div class="field-group">
                <label for="profile-email">Email</label>
                <input id="profile-email" name="email" type="email" required />
              </div>
              <div class="field-group">
                <label for="profile-phone">Phone number</label>
                <input id="profile-phone" name="phone" type="tel" required />
              </div>
            </div>

            <div class="field-grid">
              <div class="field-group">
                <label for="profile-department">Department</label>
                <input id="profile-department" name="department" type="text" required />
              </div>
              <div class="field-group">
                <label for="profile-level">Level</label>
                <select id="profile-level" name="level" required>
                  <option>100</option>
                  <option>200</option>
                  <option>300</option>
                  <option>400</option>
                  <option>500</option>
                  <option>Graduate</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Save changes</button>
          </form>
        </section>
      </main>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
