<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse Books | E-Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="app-body">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand">
            <span class="brand-mark">E</span>
            <span>E-Library</span>
          </div>
        </div>

        <nav class="side-nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="books.html" class="active">Browse Books</a>
          <a href="my-books.html">My Books</a>
          <a href="logbook.html">Library Logbook</a>
          <a href="profile.html">Profile</a>
        </nav>

        <div class="sidebar-footer">
          <button type="button" class="btn btn-secondary btn-block" data-logout>Logout</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Library Catalog</p>
            <h1>Browse books</h1>
          </div>
          <div class="topbar-right">
            <div class="user-pill" id="user-pill"></div>
          </div>
        </header>

        <section class="catalog-toolbar panel-card">
          <div class="field-group search-field">
            <label for="book-search">Search</label>
            <input id="book-search" type="search" placeholder="Title, author, ISBN, category" />
          </div>
          <div class="field-group filter-field">
            <label for="category-filter">Category</label>
            <select id="category-filter">
              <option value="all">All categories</option>
            </select>
          </div>
          <div class="field-group filter-field">
            <label for="availability-filter">Availability</label>
            <select id="availability-filter">
              <option value="all">All</option>
              <option value="available">Available</option>
              <option value="unavailable">Unavailable</option>
            </select>
          </div>
        </section>

        <section class="results-header">
          <p id="book-count">0 books</p>
        </section>

        <section class="book-grid" id="catalog-list"></section>
      </main>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <script src="js/app.js"></script>
    <script src="js/books.js"></script>
  </body>
</html>
